<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Smart Farming</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
  background: url('https://tektelic.com/wp-content/uploads/08-Top-3-smart-agriculture-solutions-to-resist-climate-changes-.webp') no-repeat center center fixed;
  background-size: cover;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', sans-serif;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
}
.card {
  border-radius: 20px;
  z-index: 1;
  position: relative;
  background: rgba(255,255,255,0.96);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  width: 420px;
  padding: 40px;
  animation: slideUp 0.6s ease-out;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(40px); }
  to   { opacity: 1; transform: translateY(0); }
}
h3 { font-weight: 700; color: #2e7d32; text-align: center; margin-bottom: 25px; }
.form-control { border-radius: 10px; padding: 12px; font-size: 14px; transition: 0.3s; }
.form-control:focus { border-color: #2e7d32; box-shadow: 0 0 0 3px rgba(46,125,50,0.15); }
.btn-success { background: linear-gradient(135deg,#2e7d32,#56ab2f); border: none; font-weight: 600; padding: 12px; border-radius: 10px; transition: 0.3s; }
.btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(46,125,50,0.4); }
.btn-success:disabled { opacity: 0.7; transform: none; }
a { color: #2e7d32; font-weight: 500; }
#msg { border-radius: 8px; font-size: 14px; }
.input-icon { position: relative; }
.input-icon i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888; }
.input-icon input { padding-left: 38px; }
@media(max-width:500px) { .card { width: 92%; padding: 25px; } }
</style>
</head>
<body>
<div class="card shadow">
  <h3>🔐 Farmer Login</h3>
  <div id="msg" class="alert d-none mb-3"></div>
  <form id="loginForm">
    <div class="mb-3 input-icon">
      <i class="fa fa-envelope"></i>
      <input type="email" id="email" class="form-control" placeholder="Email address" required>
    </div>
    <div class="mb-3 input-icon">
      <i class="fa fa-lock"></i>
      <input type="password" id="password" class="form-control" placeholder="Password" required>
    </div>
    <button type="submit" class="btn btn-success w-100" id="loginBtn">
      <span id="btnText">Login</span>
      <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
    </button>
  </form>
  <div class="text-center mt-3">
    <a href="register.html">New farmer? Register here</a>
  </div>
</div>

<script src="api.js"></script>
<script>
// Redirect if already logged in
if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const spinner = document.getElementById('btnSpinner');
  const btnText = document.getElementById('btnText');
  const msg = document.getElementById('msg');

  btn.disabled = true;
  spinner.classList.remove('d-none');
  btnText.textContent = 'Logging in...';
  msg.className = 'alert d-none mb-3';

  try {
    const data = await apiFetch('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });

    if (data.error) {
      msg.className = 'alert alert-danger mb-3';
      msg.textContent = '❌ ' + data.error;
    } else {
      Auth.save(data.token, data.user);
      msg.className = 'alert alert-success mb-3';
      msg.textContent = '✅ Login successful! Redirecting...';
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    }
  } catch {
    msg.className = 'alert alert-danger mb-3';
    msg.textContent = '❌ Server error. Make sure backend is running.';
  } finally {
    btn.disabled = false;
    spinner.classList.add('d-none');
    btnText.textContent = 'Login';
  }
});
</script>
</body>
</html>
