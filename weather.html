<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate Weather Intelligence</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { transition:0.5s; background:linear-gradient(135deg,#e8f5e9,#c8e6c9); font-family:'Segoe UI',sans-serif; }
.navbar { background:#2e7d32 !important; }
.card { border:none; border-radius:15px; background:white; box-shadow:0 6px 20px rgba(0,0,0,0.1); transition:0.4s; opacity:0; transform:translateY(20px); }
.card.visible { opacity:1; transform:translateY(0); }
.card:hover { transform:translateY(-5px); box-shadow:0 12px 30px rgba(0,0,0,0.15); }
.risk-low { color:#2e7d32; font-weight:bold; }
.risk-medium { color:#f9a825; font-weight:bold; }
.risk-high { color:#d32f2f; font-weight:bold; }

#alertBanner { display:none; padding:12px; text-align:center; font-weight:bold; border-radius:10px; margin-bottom:15px; color:white; animation:blink 1s infinite alternate; }
@keyframes blink { from{opacity:1;} to{opacity:0.6;} }

/* Weather themes */
body.summer { background:linear-gradient(135deg,#ffcc80,#ff7043); }
body.summer .navbar { background:#e65100 !important; }
body.rain { background:linear-gradient(135deg,#90caf9,#1976d2); }
body.rain .navbar { background:#0d47a1 !important; }
body.winter { background:linear-gradient(135deg,#e1f5fe,#81d4fa); }
body.winter .navbar { background:#0277bd !important; }
body.dark-mode { background:#121212; color:white; }
body.dark-mode .card { background:#1e1e1e; color:white; }

/* Animated weather icon */
.weather-icon { font-size:4rem; animation:float 3s ease-in-out infinite; display:block; text-align:center; }
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }

/* City search */
.search-bar { display:flex; gap:10px; margin-bottom:20px; }
.search-bar input { flex:1; border-radius:10px; border:2px solid #2e7d32; padding:10px 15px; font-size:15px; }
.search-bar button { background:#2e7d32; color:white; border:none; border-radius:10px; padding:10px 20px; font-weight:600; transition:0.3s; }
.search-bar button:hover { background:#1b5e20; transform:scale(1.05); }

/* Stat cards */
.stat-val { font-size:2rem; font-weight:700; color:#1b5e20; }
body.dark-mode .stat-val { color:#a5d6a7; }

@media(max-width:768px) { body{flex-direction:column;} .main{padding:15px;} .card{padding:15px;} }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
  <span class="navbar-brand fw-bold">🌾 Agro Climate Intelligence</span>
  <div>
    <a href="dashboard.html" class="btn btn-outline-light me-2">← Dashboard</a>
    <button class="btn btn-light" onclick="toggleDark()">🌙 Dark Mode</button>
  </div>
</div>
</nav>

<div class="container mt-4">
  <div id="alertBanner"></div>

  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="citySearch" placeholder="Search city (e.g. Nashik, Pune, Mumbai)..." value="Nashik">
    <button onclick="fetchWeather()">🔍 Search</button>
  </div>

  <!-- Weather icon + description -->
  <div class="text-center mb-3">
    <span class="weather-icon" id="weatherIcon">🌤</span>
    <p id="weatherDesc" style="font-size:18px;font-weight:600;color:#1b5e20;"></p>
  </div>

  <!-- Stats -->
  <div class="row g-4">
    <div class="col-md-3 col-6"><div class="card p-3 text-center">
      <h6>🌡 Temperature</h6><div class="stat-val" id="temp">--</div>
    </div></div>
    <div class="col-md-3 col-6"><div class="card p-3 text-center">
      <h6>💧 Humidity</h6><div class="stat-val" id="humidity">--</div>
    </div></div>
    <div class="col-md-3 col-6"><div class="card p-3 text-center">
      <h6>🌧 Rain</h6><div class="stat-val" id="rain">--</div>
    </div></div>
    <div class="col-md-3 col-6"><div class="card p-3 text-center">
      <h6>💨 Wind</h6><div class="stat-val" id="wind">--</div>
    </div></div>
  </div>

  <!-- Risk -->
  <div class="card mt-4 p-4">
    <h4>⚠ Climate Risk Assessment</h4>
    <p>Risk Level: <span id="riskLevel">--</span></p>
    <div class="progress" style="height:20px;">
      <div id="riskBar" class="progress-bar bg-success" style="width:0%;transition:1s;">0%</div>
    </div>
    <p id="riskAdvice" class="mt-3" style="font-weight:500;"></p>
  </div>

  <!-- Chart -->
  <div class="card mt-4 p-4">
    <h5>📊 Temperature Trend (Last 8 Readings)</h5>
    <canvas id="forecastChart"></canvas>
  </div>
</div>

<script src="api.js"></script>
<script>
function toggleDark() { document.body.classList.toggle('dark-mode'); }

const weatherIcons = { Clear:'☀️', Clouds:'⛅', Rain:'🌧', Drizzle:'🌦', Thunderstorm:'⛈', Snow:'❄️', Mist:'🌫', Haze:'🌫', Fog:'🌫' };

const tempData = [], labels = [];
const ctx = document.getElementById('forecastChart').getContext('2d');
const forecastChart = new Chart(ctx, {
  type: 'line',
  data: { labels, datasets: [{ label: 'Temperature (°C)', data: tempData, borderColor: '#2e7d32', borderWidth: 3, tension: 0.4, fill: true, backgroundColor: 'rgba(46,125,50,0.1)' }] },
  options: { responsive: true, plugins: { legend: { labels: { color: '#1b5e20' } } } }
});

function updateChart(value) {
  if (tempData.length > 8) { tempData.shift(); labels.shift(); }
  tempData.push(value);
  labels.push(new Date().toLocaleTimeString());
  forecastChart.update();
}

async function fetchWeather() {
  const city = document.getElementById('citySearch').value || 'Nashik';
  try {
    const data = await apiFetch(`/weather?city=${encodeURIComponent(city)}`);

    document.getElementById('temp').textContent     = data.temp + ' °C';
    document.getElementById('humidity').textContent = data.humidity + ' %';
    document.getElementById('rain').textContent     = data.rain + ' mm';
    document.getElementById('wind').textContent     = data.wind + ' km/h';
    document.getElementById('weatherDesc').textContent = `📍 ${data.city} — ${data.description}${data.simulated ? ' (simulated)' : ''}`;

    // Animated icon
    const mainCondition = data.description.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const iconKey = Object.keys(weatherIcons).find(k => data.description.toLowerCase().includes(k.toLowerCase())) || 'Clear';
    document.getElementById('weatherIcon').textContent = weatherIcons[iconKey] || '🌤';

    applyTheme(data.temp, data.rain);
    assessRisk(data.temp, data.humidity, data.rain, data.uv);
    updateChart(data.temp);

    // Animate cards
    document.querySelectorAll('.card').forEach((c, i) => {
      setTimeout(() => c.classList.add('visible'), i * 100);
    });
  } catch {
    document.getElementById('weatherDesc').textContent = '❌ Could not load weather. Check backend.';
  }
}

function applyTheme(temp, rain) {
  document.body.classList.remove('summer','rain','winter');
  if (temp > 38) document.body.classList.add('summer');
  else if (rain > 5) document.body.classList.add('rain');
  else if (temp < 20) document.body.classList.add('winter');
}

function assessRisk(temp, humidity, rain, uv) {
  let score = 0;
  if (temp > 38) score += 30;
  if (rain > 5) score += 25;
  if (humidity > 85) score += 15;
  if (uv > 8) score += 10;

  let risk = 'LOW', cls = 'risk-low', advice = '✅ Conditions are stable. Good time for field activities.';
  if (score > 60) { risk = 'HIGH'; cls = 'risk-high'; advice = '🚨 Extreme weather! Protect crops, avoid irrigation during peak heat.'; showAlert('🚨 Extreme Weather Alert!', '#d32f2f'); }
  else if (score > 30) { risk = 'MEDIUM'; cls = 'risk-medium'; advice = '⚠ Moderate risk. Monitor crops closely and check soil moisture.'; showAlert('⚠ Moderate Weather Risk', '#f9a825'); }
  else hideAlert();

  document.getElementById('riskLevel').textContent = risk;
  document.getElementById('riskLevel').className = cls;
  document.getElementById('riskAdvice').textContent = advice;
  const bar = document.getElementById('riskBar');
  bar.style.width = score + '%';
  bar.textContent = score + '%';
  bar.className = `progress-bar ${score > 60 ? 'bg-danger' : score > 30 ? 'bg-warning' : 'bg-success'}`;
}

function showAlert(msg, color) {
  const b = document.getElementById('alertBanner');
  b.style.display = 'block'; b.style.background = color; b.textContent = msg;
}
function hideAlert() { document.getElementById('alertBanner').style.display = 'none'; }

// Auto refresh every 30s
setInterval(fetchWeather, 30000);
fetchWeather();
</script>
</body>
</html>
